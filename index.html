<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>
  <body>
    <div class="eisenhower-info">
      <img src="./eisenhower-matrix.jpg" /><a
        class="eisenhower-info-more"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </div>
    <div class="todo-app-wrapper">
      <div class="new-task" id="topSectionForAddingElementToList">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="new-task-input" type="text" /><button
            id="add-button"
          >
            Add
          </button>
        </div>
      </div>
      <h3>Todo</h3>
      <ul id="incomplete-tasks">
        <li>
          <input type="checkbox" /><label class="task-label">Pay Bills</label
          ><input type="text" class="edit-task-input" /><button class="edit">
            Edit</button
          ><button class="delete"><img src="./remove.svg" /></button>
        </li>
        <li class="editMode">
          <input type="checkbox" /><label class="task-label">Go Shopping</label
          ><input
            type="text"
            value="Go Shopping"
            class="edit-task-input"
          /><button class="edit">Save</button
          ><button class="delete"><img src="./remove.svg" /></button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked /><label class="task-label"
            >See the Doctor</label
          ><input type="text" class="edit-task-input" /><button class="edit">
            Edit</button
          ><button class="delete"><img src="./remove.svg" /></button>
        </li>
      </ul>
    </div>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
